<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClownVoiceCommand</title>
<meta name="description" content="Speaking training: five daily drills, recorded reps, synced progress.">
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClownVoice">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#07090D; --surface:#121925; --sunk:#0B1018; --ink:#F2F4F7; --muted:#9AA5B4; --line:#253043;
  --accent:#FFC61A; --accent-ink:#0A0A0A; --accent-soft:#2B2410; --blue:#15233F; --steel:#1C2433;
  --onair:#FFC61A; --good:#3DD68C; --good-soft:#0F2E21; --warn:#FF8A3D; --warn-soft:#33200F; --bad:#FF5A5F; --bad-soft:#3A1519;
  --display:"Exo 2","Trebuchet MS",sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --glow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),0 8px 28px -12px color-mix(in srgb,var(--accent) 55%,transparent);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 55% at 50% -10%,#16264a 0%,rgba(22,38,74,0) 62%) fixed,var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto}
@media (min-width:1100px){.wrap{max-width:960px}}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:30px}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:500}
button{transition:transform .12s var(--ease),border-color .2s,background .2s,box-shadow .2s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
.block>summary{transition:background .2s}
.block>summary:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.block{transition:box-shadow .3s var(--ease),border-color .3s}
.stat,.card,.lvl{transition:transform .2s var(--ease),border-color .2s}
.card:hover,.lvl:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
@media (prefers-reduced-motion:no-preference){
  section.view:not([hidden]){animation:fadeup .28s var(--ease)}
  .block[open] .bbody{animation:fadeup .25s var(--ease)}
  @keyframes fadeup{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  button.rec.on{animation:recpulse 1.2s ease-in-out infinite}
  @keyframes recpulse{50%{box-shadow:0 0 4px -2px var(--accent)}}
}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:0 0 18px -6px var(--accent)}
button.rec{border-color:var(--accent);color:var(--ink);background:var(--steel);min-height:52px;padding:10px 18px;border-radius:999px;font-weight:600}
button.rec.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 22px -4px var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--steel);overflow:hidden;margin-top:8px;flex-basis:100%}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--accent) 70%,var(--bad));transition:width .08s linear}
.tbar{height:4px;border-radius:2px;background:var(--steel);overflow:hidden;flex-basis:100%}
.tbar b{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.upl{font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
button:disabled{opacity:.5;cursor:not-allowed}
textarea,input,select{font-size:16px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:clamp(38px,11vw,50px);height:auto;border-radius:10px;filter:drop-shadow(0 0 10px rgba(47,160,255,.35))}
.brand h1{font-size:clamp(19px,5.4vw,26px);font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,#E6EAF0 0%,#E6EAF0 38%,var(--accent) 60%,#FFE27A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sync{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sync.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lamp.live{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.levelchip{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:500}
nav.tabs{display:flex;gap:4px;max-width:760px;margin:10px auto 0}
nav.tabs button{flex:1;border:none;background:transparent;border-radius:10px;padding:8px 6px;min-height:46px;color:var(--muted);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em}
nav.tabs button{transition:color .2s,background .2s}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
@media (max-width:820px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--ground)}
  nav.tabs{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:fixed;left:0;right:0;bottom:0;margin:0;background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
  nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
}
.banner{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:18px}

/* today */
.next{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,#15233F 0%,#0E1522 65%,#0A0A0A 100%);box-shadow:var(--glow);position:relative;overflow:hidden}
.next::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.segs i{height:6px;border-radius:3px;background:var(--steel);transition:background .4s var(--ease),box-shadow .4s var(--ease)}
.segs i.on{background:var(--accent);box-shadow:0 0 10px -2px var(--accent)}
.next .eyebrow{color:var(--accent)}
.next .goal{font-size:14px;color:#C9D1DC}
.next h2{color:#fff}
.next h2{font-size:26px}
.dayline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.block{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 16px;min-height:56px}
.block>summary::-webkit-details-marker{display:none}
.bnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border:1.5px solid var(--line)}
.block.done .bnum{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.block[open]{box-shadow:var(--glow);border-color:transparent}
.btitle{display:flex;flex-direction:column}
.btitle small{color:var(--muted);font-size:13px}
.bmin{font-family:var(--mono);font-size:13px;color:var(--muted)}
.bbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.lesson{font-size:15px;max-width:65ch}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.timer .clock{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums;min-width:92px}
.timer button{min-height:40px;padding:8px 12px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.steps li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
ol.steps li .at{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:1px}
ol.steps li{transition:background .3s,border-color .3s}
ol.steps li.now{border-color:var(--accent);background:var(--accent-soft)}
.material{border-left:3px solid var(--accent);padding:8px 12px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:15px}
.material .eyebrow{margin-bottom:4px}
.material ul{margin:4px 0 0;padding-left:18px}
.pass{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--good-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:0;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--good)}

/* rep */
.rep{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.prompt{font-size:16px;font-weight:500;max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{padding:8px 10px;border-radius:8px;background:var(--sunk)}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.stat.good b{color:var(--good)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--blue);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.fb .eyebrow{color:var(--accent)}
.fb .scores{font-family:var(--mono);font-size:13px}
.fb .rewrite{white-space:pre-wrap;font-size:15px;background:var(--surface);padding:10px 12px;border-radius:8px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.msg{padding:8px 12px;border-radius:10px;max-width:88%;font-size:15px}
.msg.them{background:var(--sunk);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg .who{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}

/* progress */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.chart svg{width:100%;height:auto;display:block}
.gate{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.gate li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:360px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--sunk);display:block}
.cal i.min{background:color-mix(in srgb,var(--good) 45%,var(--sunk))}
.cal i.full{background:var(--good)}
.cal i.today{outline:2px solid var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;background:currentColor}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
td.mono{font-family:var(--mono)}

/* plan */
.lvl{background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lvl .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 60%,transparent);grid-row:span 3}
.lvl.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent),var(--glow)}
.lvl ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:500;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){ .lamp.live{animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} }

/* ===== deep 3D yellow ===== */
:root{
  --y-grad:linear-gradient(180deg,#FFEA8A 0%,#FFD23A 28%,#FFC61A 55%,#E3A600 100%);
  --y-edge:#8A6200; --y-deep:#4A3400;
  --y-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(120,80,0,.35),inset 0 0 0 1px rgba(255,236,150,.35),0 4px 0 var(--y-edge),0 6px 0 var(--y-deep),0 12px 22px -6px rgba(255,198,26,.55);
  --y-shadow-press:inset 0 1px 0 rgba(255,255,255,.5),inset 0 2px 6px rgba(120,80,0,.45),0 1px 0 var(--y-edge),0 2px 0 var(--y-deep),0 4px 10px -4px rgba(255,198,26,.45);
  --k-grad:linear-gradient(180deg,#26324A 0%,#18212F 55%,#111823 100%);
  --k-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 0 #05070B,0 8px 16px -8px rgba(0,0,0,.8);
}
.brand h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#E6EAF0;text-shadow:0 1px 0 #9AA5B4,0 2px 0 #5B6573,0 3px 6px rgba(0,0,0,.6)}
.y3d-text{color:#FFC61A;text-shadow:0 1px 0 #E3A600,0 2px 0 #B98800,0 3px 0 #8A6200,0 4px 0 #4A3400,0 6px 10px rgba(0,0,0,.7),0 0 18px rgba(255,198,26,.35)}
button{background:var(--k-grad);box-shadow:var(--k-shadow);border-color:#2B3850;border-top-color:#3A4866}
button:hover{border-color:#3A4866;border-top-color:var(--accent)}
button:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 #05070B}
button.primary,button.rec.on,nav.tabs button[aria-selected="true"],.levelchip{background:var(--y-grad);color:#0A0A0A;border:1px solid #FFE27A;border-bottom-color:#B98800;text-shadow:0 1px 0 rgba(255,255,255,.45);box-shadow:var(--y-shadow)}
button.primary:active,button.rec.on:active,nav.tabs button[aria-selected="true"]:active{transform:translateY(4px);box-shadow:var(--y-shadow-press)}
nav.tabs button[aria-selected="true"]{margin-bottom:6px}
nav.tabs{align-items:flex-start}
.levelchip{box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,80,0,.35),0 2px 0 var(--y-edge),0 3px 0 var(--y-deep),0 6px 12px -4px rgba(255,198,26,.5);font-weight:600}
button.rec{background:var(--k-grad);border:1px solid #FFC61A;box-shadow:var(--k-shadow),0 0 0 1px rgba(255,198,26,.15)}
.sync{cursor:pointer;min-height:30px;padding:4px 10px;font-family:var(--mono);font-size:11px;border-radius:999px}
.sync.on{color:var(--good);border-top-color:var(--good)}
.sync.busy{color:var(--accent)}
.next{border:1px solid #FFD23A;border-bottom-color:#8A6200;border-right-color:#B98800;box-shadow:inset 0 1px 0 rgba(255,236,150,.35),0 3px 0 #8A6200,0 5px 0 #4A3400,0 18px 36px -14px rgba(255,198,26,.55)}
.next::after{background:var(--y-grad);width:6px;box-shadow:inset -1px 0 0 rgba(0,0,0,.25)}
.block[open]{border:1px solid #FFD23A;border-bottom-color:#8A6200;box-shadow:inset 0 1px 0 rgba(255,236,150,.25),0 3px 0 #8A6200,0 5px 0 #4A3400,0 16px 30px -16px rgba(255,198,26,.55)}
.block{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 0 #05070B}
.block.done .bnum{background:radial-gradient(circle at 35% 30%,#7CF3B6,#3DD68C 55%,#1F9A5E);border-color:#1F9A5E;box-shadow:0 2px 0 #0E5A36}
.block[open] .bnum{background:var(--y-grad);border-color:#FFE27A;color:#0A0A0A;box-shadow:0 2px 0 var(--y-edge),0 3px 0 var(--y-deep)}
.segs i{height:10px;border-radius:5px;background:linear-gradient(180deg,#0B1018,#1C2433);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.segs i.on{background:var(--y-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 var(--y-edge),0 0 12px -2px rgba(255,198,26,.8)}
.tbar,.meter{height:10px;border-radius:5px;background:linear-gradient(180deg,#0B1018,#1C2433);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.tbar b{background:var(--y-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.material{border-left:0;position:relative;padding-left:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.material::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px;background:var(--y-grad);box-shadow:inset -1px 0 0 rgba(0,0,0,.3),1px 0 0 var(--y-edge)}
.stat{background:linear-gradient(180deg,#141C29,#0B1018);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #05070B}
.fb{box-shadow:inset 0 1px 0 rgba(255,236,150,.2),0 3px 0 #0A1426}
.msg.me{background:var(--y-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 var(--y-edge)}
.lvl .n{color:#FFC61A;text-shadow:0 1px 0 #E3A600,0 2px 0 #B98800,0 3px 0 #8A6200,0 4px 0 #4A3400,0 8px 14px rgba(0,0,0,.7)}
.lvl.cur{border-color:#FFD23A;box-shadow:inset 6px 0 0 #FFC61A,0 3px 0 #8A6200,0 5px 0 #4A3400,0 16px 30px -16px rgba(255,198,26,.5)}
.pill.good,.pill.warn{box-shadow:0 2px 0 rgba(0,0,0,.5)}
.check input{accent-color:#FFC61A}
.toast{background:var(--y-grad);color:#0A0A0A;box-shadow:var(--y-shadow)}
@media (prefers-reduced-motion:no-preference){button.rec.on{animation:recpulse3d 1.2s ease-in-out infinite}@keyframes recpulse3d{50%{filter:brightness(1.15)}}}

/* ===== layout + navigation v5 ===== */
.wrap{max-width:980px}
header.top{margin-inline:-16px;padding:10px 16px}
.bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{flex:0 0 auto}
.status{display:flex;align-items:center;gap:8px;margin-left:auto}
nav.tabs{margin:0 auto;flex:1 1 380px;max-width:480px;display:flex;gap:6px;align-items:center}
nav.tabs button{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:0}
nav.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs button:not([aria-selected="true"]){background:transparent;box-shadow:none;border-color:transparent}
nav.tabs button:not([aria-selected="true"]):hover{color:var(--ink);background:var(--steel)}
@media (max-width:820px){
  header.top{position:relative;top:auto;padding-block:12px 10px}
  .brand img{width:40px}
  .status{margin-left:0;width:100%}
  nav.tabs{max-width:none;gap:4px;align-items:stretch}
  nav.tabs button{flex-direction:column;gap:2px;font-size:12px;min-height:54px;padding:6px 4px;margin-bottom:0}
  nav.tabs svg{width:22px;height:22px}
}
/* Today grid + stepper */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.blocks{display:flex;flex-direction:column;gap:14px;min-width:0}
details.block{scroll-margin-top:calc(var(--hdr,0px) + 76px)}
.rail{position:sticky;top:calc(var(--hdr,0px) + env(safe-area-inset-top,0px));z-index:4;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--ground) 94%,transparent);border-bottom:1px solid var(--line)}
.railhead,.railinfo{display:none}
.stepper{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px 6px 6px;border-radius:999px;font-size:14px;white-space:nowrap}
.stepper .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--sunk);border:1px solid var(--line)}
.stepper .sm{display:none;margin-left:auto;font-size:12px;color:var(--muted)}
.stepper button.done .sn{background:radial-gradient(circle at 35% 30%,#7CF3B6,#3DD68C 55%,#1F9A5E);border-color:#1F9A5E;color:#062015}
.stepper button.cur{background:var(--y-grad);color:#0A0A0A;border:1px solid #FFE27A;border-bottom-color:#B98800;box-shadow:var(--y-shadow);margin-bottom:6px}
.stepper button.cur .sn{background:#0A0A0A;color:var(--accent);border-color:#0A0A0A}
.stepper button.cur .sm{color:#3a3000}
.next .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.next .pill{background:rgba(0,0,0,.35);border-color:#2E3B52;color:#C9D1DC}
.nextbtn{align-self:flex-end}
@media (min-width:1100px){
  .wrap,.bar{max-width:1140px}
  .today-grid{grid-template-columns:260px minmax(0,1fr);align-items:start;column-gap:22px}
  .today-grid>.next,.today-grid>.banner{grid-column:1/-1}
  .rail{margin:0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);top:calc(var(--hdr,72px) + 16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 0 #05070B}
  .railhead{display:block;margin-bottom:10px}
  .railinfo{display:block;font-size:13px;margin-top:10px}
  .stepper{flex-direction:column;overflow:visible;padding:0}
  .stepper button{width:100%;border-radius:10px;min-height:50px;padding:8px 12px 8px 8px}
  .stepper .sm{display:block}
  .stepper button.cur{margin-bottom:6px}
}
nav.tabs button[aria-selected="true"]{margin-bottom:0}
.gate .pill{white-space:nowrap;flex:none;align-self:center}
.upl.uplbtn{text-decoration:none;color:#0A0A0A;background:var(--y-grad);border:1px solid #FFE27A;border-bottom-color:#B98800;box-shadow:var(--y-shadow);border-radius:999px;padding:10px 18px;font-weight:600;margin-top:4px}
/* progress */
.charts{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart .row{flex-wrap:nowrap}
.chart h3{flex:1;min-width:0}
.chart .row .mono{flex:none}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:4px;max-width:none;width:max-content}
.cal i{width:16px;height:16px;aspect-ratio:auto;border-radius:4px}
.gate .pill.neutral{background:var(--sunk);color:var(--muted);border-color:var(--line)}
@media (max-width:420px){.cal{grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px}.cal i{width:14px;height:14px}}

.gatewrap{position:fixed;inset:0;z-index:20;background:rgba(5,7,11,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;overflow:auto}
.gatecard{width:min(440px,100%)}
.gatecard .brand h1{font-size:24px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} html,body{margin:0} img{max-width:100%}</style>

const dk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

/* ---------- text analysis (same term lists as voice-analyzer.py) ---------- */
function countTerms(text,terms){const t=" "+String(text).toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ")+" ";const o={};let n=0;for(const k of terms){const re=new RegExp("(?<= )"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?= )","g");const c=(t.match(re)||[]).length;if(c){o[k]=c;n+=c;}}return {n,detail:o};}
function analyzeText(text){const words=(String(text).trim().match(/\S+/g)||[]).length;const f=countTerms(text,FILLERS),hd=countTerms(text,HEDGES),tc=countTerms(text,TICS);return {words,fillers:f.n,hedges:hd.n,tics:tc.n,fd:f.detail,hdd:hd.detail,f100:words?+(f.n/words*100).toFixed(1):0,h100:words?+(hd.n/words*100).toFixed(1):0};}

/* ---------- session data ---------- */
function sess(date=TODAY){if(!S.sessions[date])S.sessions[date]={date,level:S.prog.level||1,blocks:{},reps:[],vocabManual:[]};return S.sessions[date];}
function saveSession(date=TODAY){S.touched=true;const doc=JSON.parse(JSON.stringify(sess(date)));if(doc.reps&&doc.reps.length>30)doc.reps=doc.reps.slice(-30);
  if(!S.db){toast("Not saved: the log isn't connected in this view");return Promise.resolve();}

function makeRecorder(onUpdate){

  return {
    get on(){return !!iv;},
    async start(){
      ctx=new (window.AudioContext||window.webkitAudioContext)();const resumed=ctx.resume();
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){try{ctx.close();}catch(e){}throw new Error("no-mic");}
      try{stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("mic-timeout")),7000))]);}catch(e){try{ctx.close();}catch(x){}throw e;}
      await resumed;
      const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=2048;src.connect(an);buf=new Float32Array(an.fftSize);
      frames=[];chunks=[];t0=performance.now();

    },

      stream&&stream.getTracks().forEach(t=>t.stop());try{ctx&&ctx.close();}catch(e){}
      if(url)URL.revokeObjectURL(url);url=chunks.length?URL.createObjectURL(new Blob(chunks,{type:chunks[0].type||"audio/webm"})):null;

function pitchOf(buf,sr){
  const n=Math.floor(buf.length/2),x=new Float32Array(n);let e=0;for(let i=0;i<n;i++){x[i]=buf[2*i];e+=x[i]*x[i];}

  const cs=new Float32Array(maxL+1);let best=0;

  if(best<0.6)return 0;for(let L=minL;L<=maxL;L++){if(cs[L]>=best*0.9&&cs[L]>=cs[L-1]&&cs[L]>=cs[L+1])return fs/L;}return 0;
}
function analyzeFrames(fr,url){

async function analyzeFile(file){
  const AC=window.AudioContext||window.webkitAudioContext;const c=new AC();const ab=await file.arrayBuffer();

  for(let i=0;i+w<=d.length;i+=w){let s=0,pk=0;for(let j=i;j<i+w;j++){const x=d[j];s+=x*x;const a=x<0?-x:x;if(a>pk)pk=a;}const seg=d.subarray(i,Math.min(d.length,i+2048));fr.push({db:20*Math.log10(Math.sqrt(s/w)+1e-9),pk,f0:seg.length>=1024?pitchOf(seg,buf.sampleRate):0});}

}

const TIMERS=[];
function timerPanel(min,steps){
  const id=uid();const total=min*60;let el0=0,start=null,iv=null;
  const el=h(`<div><div class="timer"><span class="clock" id="${id}-c">${min}:00</span><button type="button" id="${id}-g">Start</button><button type="button" id="${id}-r">Reset</button><div class="tbar"><b id="${id}-p"></b></div></div>
   <ol class="steps" style="margin-top:10px">${steps.map(s=>`<li data-at="${s[0]}"><span class="at">${s[0]}</span><span>${esc(s[1])}</span></li>`).join("")}</ol></div>`);
  const clock=$("#"+id+"-c",el),go=$("#"+id+"-g",el),lis=[...el.querySelectorAll("li")];
  const secs=lis.map(li=>{const [m,s]=li.dataset.at.split(":").map(Number);return m*60+s;});
  const elapsed=()=>el0+(start?(Date.now()-start)/1000:0);
  const pb=$("#"+id+"-p",el);const draw=()=>{const e=Math.min(elapsed(),total),r=Math.max(total-e,0);pb.style.width=(e/total*100)+"%";clock.textContent=Math.floor(r/60)+":"+String(Math.floor(r%60)).padStart(2,"0");let k=0;secs.forEach((s,i)=>{if(e>=s)k=i;});lis.forEach((li,i)=>li.classList.toggle("now",(start||el0>0)&&i===k));if(e>=total&&start){pause();beep();toast("Time. Mark the block done.");}};
  const pause=()=>{if(start){el0+=(Date.now()-start)/1000;start=null;}clearInterval(iv);iv=null;go.textContent=el0>0?"Resume":"Start";};
  const run=()=>{TIMERS.forEach(t=>t!==api&&t.pause());start=Date.now();iv=setInterval(draw,250);go.textContent="Pause";S.touched=true;};
  go.onclick=()=>start?pause():run();$("#"+id+"-r",el).onclick=()=>{pause();el0=0;go.textContent="Start";draw();};
  const api={pause};TIMERS.push(api);return el;
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);setTimeout(()=>c.close(),600);}catch(e){}}

function chart(title,pts,key,opts){

    svg+=`<path d="${d} L ${X(data.length-1)} ${Y(ymin)} L ${X(0)} ${Y(ymin)} Z" fill="var(--accent)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    data.forEach((p,i)=>{const last=i===data.length-1;svg+=`<circle cx="${X(i)}" cy="${Y(p[key])}" r="${last?4.5:2.5}" fill="${last?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.5"><title>${p.date}: ${p[key]}</title></circle>`;});

function gateEval(){
  const lv=L(),g=lv.gate,ss=levelSessions(lv.n),bp=ss.filter(s=>s.bench).slice(-3).map(s=>({...s.bench,analyzer:s.analyzer}));const n3=bp.length>=3;
  const avg=(f)=>bp.length?bp.reduce((a,b)=>a+(f(b)??0),0)/bp.length:null;
  const fv=b=>b.analyzer&&b.analyzer.f100!=null?b.analyzer.f100:b.f100,hv=b=>b.analyzer&&b.analyzer.h100!=null?b.analyzer.h100:b.h100;
  const R=[];const add=(label,ok,val,pend)=>R.push({label,ok,val,pending:pend===undefined?(!ok&&!n3):pend});
  add(`Sessions at this level: ${g.minSessions}`,ss.length>=g.minSessions,`${ss.length}/${g.minSessions}`,ss.length<g.minSessions);
  const f=avg(fv),hh=avg(hv);
  add(`Fillers ≤ ${g.fillers} per 100 words (last 3 benchmarks)`,n3&&f<=g.fillers,f==null?"-":f.toFixed(1));
  add(`Hedges ≤ ${g.hedges} per 100 words`,n3&&hh<=g.hedges,hh==null?"-":hh.toFixed(1));
  add(`"Go ahead and" zero in all 3`,n3&&bp.every(b=>!b.tics),bp.length?bp.map(b=>b.tics||0).join(" "):"-");
  add(`Conclusion first in ${g.cf} of 3`,n3&&bp.filter(b=>b.cf).length>=g.cf,`${bp.filter(b=>b.cf).length}/3`);
  const fz=avg(b=>b.freezes);add(`Freezes ≤ ${g.freezes} per take`,n3&&fz!=null&&bp.every(b=>b.freezes!=null)&&fz<=g.freezes,fz==null?"-":fz.toFixed(1));
  if(g.maxSec)add(`Every take ≤ ${g.maxSec} seconds`,n3&&bp.every(b=>b.sec!=null&&b.sec<=g.maxSec),bp.map(b=>b.sec??"-").join(" "));
  if(g.confidence){const c=avg(b=>b.scores&&b.scores.confidence);add(`Confidence score ≥ ${g.confidence}`,n3&&c>=g.confidence,c==null?"-":c.toFixed(1));}
  if(g.leadership){const c=avg(b=>b.scores&&b.scores.leadership);add(`Leadership score ≥ ${g.leadership}`,n3&&c>=g.leadership,c==null?"-":c.toFixed(1));}
  if(g.allScores){const ok=n3&&bp.every(b=>b.scores&&Object.values(b.scores).every(x=>x>=g.allScores));add(`All six scores ≥ ${g.allScores} on each take`,ok,ok?"yes":"no");}
  if(g.vocab){const v=vocabSet().length;add(`Active vocabulary ≥ ${g.vocab} words`,v>=g.vocab,String(v),v<g.vocab);}
  return {rows:R,pass:R.every(r=>r.ok)};
}

  const ge=gateEval();
  const gc=h(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Level ${lv.n} gate</h2><span class="pill ${ge.pass?"good":""}">${ge.pass?"Ready to advance":"In progress"}</span></div>
    <p class="muted" style="font-size:14px">You move up when you pass the gate, not when the calendar says so.</p><ul class="gate">${ge.rows.map(r=>`<li><span>${esc(r.label)}</span><span class="mono pill ${r.ok?"good":r.pending?"neutral":"bad"}">${esc(r.ok?"✓ "+r.val:(r.val==="-"||r.val===""?"no data":r.val))}</span></li>`).join("")}</ul><p class="muted" style="font-size:13px">Grey means not enough benchmarks yet. Red means you have the data and it misses the target.</p></div>`);
  if(ge.pass&&lv.n<4){const b=h(`<button class="primary" type="button">Advance to Level ${lv.n+1}</button>`);b.onclick=async()=>{S.prog.level=lv.n+1;S.prog.history=(S.prog.history||[]).concat([{level:lv.n+1,date:TODAY}]);await saveProg();toast("Level "+(lv.n+1)+" unlocked");applyLevel();};gc.append(b);}
  if(ge.pass&&lv.n===4)gc.append(h(`<p class="pass">Pro gate passed. Switch to maintenance: three sessions a week, one of them from a real call recording.</p>`));
  v.append(gc);
  const vs=vocabSet();
  const tiles=h(`<div class="stats"><div class="stat"><b>${sortedSessions().filter(s=>!s.baseline&&dayStatus(s)!=="none").length}</b><span>training days</span></div><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${vs.length}</b><span>active words</span></div><div class="stat"><b>${sortedSessions().reduce((a,s)=>a+((s.reps||[]).length),0)}</b><span>scored reps</span></div></div>`);
  v.append(tiles);
  const ch=h(`<div class="charts"></div>`);
  ch.append(chart("Fillers per 100 words",pts,"f100",{base:BASELINE.fillers,target:g.fillers}));
  ch.append(chart("Hedges per 100 words",pts,"h100",{base:BASELINE.hedges,target:g.hedges}));
  ch.append(chart("Average rep score",pts,"score",{min:1,max:5,base:+(avgScore(BASELINE.scores)).toFixed(1),target:4}));
  ch.append(chart("Falling tone, % of statements",pts,"falling",{min:0,max:100,target:lv.n>=2?70:60,unit:"%"}));
  v.append(ch);
  v.append(h(`<p class="muted" style="font-size:13px">Fillers and hedges use voice-analyzer.py numbers when you paste them in Log, otherwise your dictated text. Dictation drops some fillers, so treat text counts as a floor.</p>`));
  v.append(calendar());
}
function streak(){let n=0;const d=new Date();for(let i=0;i<400;i++){const k=dk(d);const st=dayStatus(S.sessions[k]);if(st==="full"||st==="min")n++;else if(i>0){const wd=d.getDay();if(wd!==0&&wd!==6)break;}d.setDate(d.getDate()-1);}return n;}
function calendar(){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow-7*11);let cells="";for(let i=0;i<84;i++){const k=dk(d);const st=dayStatus(S.sessions[k]);cells+=`<i class="${st==="full"?"full":st==="min"||st==="part"?"min":""} ${k===TODAY?"today":""}" title="${k}"></i>`;d.setDate(d.getDate()+1);}
  return h(`<div class="card"><h3>Last 12 weeks</h3><p class="muted" style="font-size:13px">Each column is a week, Monday at the top.</p><div class="calwrap"><div class="cal">${cells}</div></div><div class="legend" style="gap:10px"><span style="color:var(--good)">full day</span><span style="color:color-mix(in srgb,var(--good) 45%,var(--muted))">minimum or partial</span></div><p class="muted" style="font-size:13px">Weekends don't break the streak.</p></div>`);}

/* ---------- PLAN ---------- */
function gateText(g){const a=[`${g.minSessions}+ sessions at the level`,`fillers ≤ ${g.fillers}/100`,`hedges ≤ ${g.hedges}/100`,`zero "go ahead and"`,`conclusion first 3 of 3`,`freezes ≤ ${g.freezes}`];if(g.maxSec)a.push(`every take ≤ ${g.maxSec}s`);if(g.confidence)a.push(`confidence ≥ ${g.confidence}`);if(g.leadership)a.push(`leadership ≥ ${g.leadership}`);if(g.allScores)a.push(`all six scores ≥ ${g.allScores}`);if(g.vocab)a.push(`${g.vocab} active words`);return a.join(" · ");}
function renderPlan(){
  const v=$("#v-plan");v.innerHTML="";
  v.append(h(`<div class="card"><h2>How this works</h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
   <li>Five blocks a day, 10 to 12 minutes each, about 55 minutes. Same order every day. Prompts rotate.</li>
   <li>Short on time: Voice Lab plus Benchmark, 20 minutes. That keeps the streak.</li>
   <li>Train five days a week. Friday: run voice-analyzer.py on the benchmark recording and paste the output in Log. That's your precise weekly number.</li>
   <li>Levels unlock by gate, measured on your last three benchmarks. Twelve weeks is the fast track if you pass each gate on schedule.</li>
   <li>Once a week, bring one real call or recording to the Speaking Coach project for a Debrief. Practice only counts if it shows up on real calls.</li>
   <li>Works on iPhone and PC with one synced log. Record in the app, or upload a Voice Memo. To dictate, use the mic key on the iPhone keyboard or Win+H on the PC.</li></ul></div>`));
  LEVELS.forEach(l=>v.append(h(`<div class="lvl ${l.n===(S.prog.level||1)?"cur":""}"><span class="n">${l.n}</span><div><span class="eyebrow">${esc(l.weeks)}</span><h3>${esc(l.name)} · ${esc(l.tag)}</h3></div><p style="font-size:14px">${esc(l.goal)}</p>
    <div style="font-size:14px"><span class="muted">Structure:</span> ${l.structure.map(esc).join(" → ")}<br><span class="muted">Benchmark:</span> ${esc(l.bench.type)}<br><span class="muted">Pressure:</span> ${esc(l.pressure.difficulty)}<br><span class="muted">Gate:</span> ${esc(gateText(l.gate))}</div></div>`)));
  v.append(h(`<div class="card"><h3>The five daily blocks</h3><div class="tbl"><table><thead><tr><th>Block</th><th>Min</th><th>What it builds</th></tr></thead><tbody>${[["Voice Lab","10","Pause instead of filler, falling tone, pace, volume on ownership lines"],["Structure Reps","12","Answer first, status updates, disagreement, exec briefings"],["Pressure Sim","12","Staying short and factual when pushed. Claude plays the other side"],["Words and Explain","10","Phrase-bank vocabulary, explaining at three altitudes"],["Benchmark and Log","10","One scored take a day that feeds your progress charts"]].map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td style="white-space:normal">${r[2]}</td></tr>`).join("")}</tbody></table></div></div>`));
}

/* ---------- LOG ---------- */
function parseAnalyzer(t){const m=(re)=>{const x=t.match(re);return x?x:null;};const o={};let x;
  if(x=m(/Pace:\s*(\d+)\s*wpm/))o.wpm=+x[1];
  if(x=m(/Freezes[^:]*:\s*(\d+)/))o.freezes=+x[1];
  if(x=m(/Fillers:\s*(\d+)[\s\S]*?per100:\s*([\d.]+)/))o.f100=+x[2];
  if(x=m(/Hedges:\s*(\d+)[\s\S]*?per100:\s*([\d.]+)/))o.h100=+x[2];
  if(x=m(/Tics:.*?(\d+)\s*\}/))o.tics=+x[1];
  if(x=m(/Intelligibility:\s*(\d+)%/))o.intel=+x[1];
  if(x=m(/falling tone:\s*(\d+)\s*\/\s*(\d+)/))o.falling=+x[2]?Math.round(+x[1]/+x[2]*100):null;
  if(x=m(/Range[^:]*:\s*([\d.]+)\s*semitones/))o.range=+x[1];
  if(x=m(/Recording peak:\s*(-?[\d.]+)/))o.peak=+x[1];
  if(x=m(/Words:\s*(\d+)/))o.words=+x[1];
  return o;}
function renderLog(){
  const v=$("#v-log");v.innerHTML="";const id=uid();
  const paste=h(`<div class="card"><h2>Paste voice-analyzer output</h2><p class="muted" style="font-size:14px">Run <span class="mono">python3 voice-analyzer.py yourfile.m4a</span> on your benchmark recording and paste the full output. Friday at minimum.</p>
    <div><label for="${id}-d">Session date</label><input id="${id}-d" type="date" value="${TODAY}"></div><div><label for="${id}-t">Output</label><textarea id="${id}-t" placeholder="=== SUMMARY ===&#10;Words: 98  Speaking time: 46.0s  Pace: 128 wpm ..."></textarea></div>
    <div class="row"><button class="primary" type="button" id="${id}-p">Parse and save</button></div><div id="${id}-o" class="mono muted" style="font-size:13px"></div></div>`);
  $("#"+id+"-p",paste).onclick=async()=>{const o=parseAnalyzer($("#"+id+"-t",paste).value);if(!Object.keys(o).length){toast("Nothing recognized. Paste the full summary.");return;}const d=$("#"+id+"-d",paste).value||TODAY;const s=sess(d);s.analyzer=o;if(!s.level)s.level=S.prog.level||1;await saveSession(d);$("#"+id+"-o",paste).textContent="Saved: "+Object.entries(o).map(([k,v])=>k+" "+v).join(" · ");toast("Analyzer data saved");};
  v.append(paste);
  v.append(settingsCard());
  const rows=sortedSessions().slice().reverse();
  v.append(h(`<div class="card"><h2>Sessions</h2><div class="tbl"><table><thead><tr><th>Date</th><th>Lvl</th><th>Blocks</th><th>Reps</th><th>Fillers/100</th><th>Hedges/100</th><th>Score</th><th>Take</th><th>Falling</th></tr></thead><tbody>${rows.map(s=>{const b=s.bench||{},a=s.analyzer||{};const f=a.f100!=null?a.f100:b.f100,hd=a.h100!=null?a.h100:b.h100;return `<tr><td class="mono">${s.date}${s.baseline?" base":""}</td><td class="mono">${s.level||"-"}</td><td class="mono">${BLOCKS.filter(x=>s.blocks&&s.blocks[x.id]).length}/5</td><td class="mono">${(s.reps||[]).length}</td><td class="mono">${f??"-"}</td><td class="mono">${hd??"-"}</td><td class="mono">${avgScore(b.scores)??"-"}</td><td class="mono">${b.sec!=null?b.sec+"s":"-"}</td><td class="mono">${a.falling!=null?a.falling+"%":"-"}</td></tr>`;}).join("")||`<tr><td colspan="9" class="muted">No sessions yet. Start with Voice Lab on Today.</td></tr>`}</tbody></table></div></div>`));
  const recent=rows.flatMap(s=>(s.reps||[]).map(r=>({...r,date:s.date}))).filter(r=>r.fb&&r.fb.biggestFix).slice(0,5);
  if(recent.length)v.append(h(`<div class="card"><h3>Recent biggest fixes</h3><ul class="gate">${recent.map(r=>`<li style="flex-direction:column"><span class="mono muted" style="font-size:12px">${r.date} · ${esc(r.block)}</span><span>${esc(r.fb.biggestFix)}</span></li>`).join("")}</ul></div>`));
}


/* ---------- sync button ---------- */
function setSync(state,extra){const b=$("#sync");if(!b)return;b.classList.toggle("on",state==="on");b.classList.toggle("busy",state==="busy");
  b.textContent=state==="busy"?"⟳ Syncing…":state==="on"?"✓ Synced"+(extra?" "+extra:""):"⚠ Not synced";}
async function syncNow(){
  if(!S.loaded){toast("Still connecting. Try again in a few seconds.");return;}
  if(!S.db){setSync("off");toast("Sign in to sync. Log tab, Account.");return;}
  setSync("busy");
  try{await S.wq;
    const [ps,qs]=await Promise.all([S.db.doc("program/state").get(),S.db.collection("sessions").get()]);
    if(ps.exists)S.prog=JSON.parse(JSON.stringify(ps.data()));
    const m={};qs.docs.forEach(d=>m[d.id]=JSON.parse(JSON.stringify(d.data())));const local=S.sessions[TODAY];S.sessions=m;if(local&&S.touched&&!m[TODAY])S.sessions[TODAY]=local;
    if(local&&S.touched&&m[TODAY]){await saveSession();}
    $("#levelchip").textContent=`Level ${L().n} · ${L().name}`;
    if(!S.touched)renderToday();else refreshTodayStatus();if(S.view==="progress")renderProgress();if(S.view==="log")renderLog();
    const n=Object.values(m).filter(s=>!s.baseline).length;const tm=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    setSync("on",tm);toast(`Synced at ${tm}. ${n} training day${n===1?"":"s"} in your log.`);
  }catch(e){console.warn(e);setSync("off");toast("Sync failed. Check your connection and tap again.");}
}
document.addEventListener("click",e=>{if(e.target.closest("#sync"))syncNow();});
/* ---------- shell ---------- */
function show(view){S.view=view;document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.dataset.v===view;b.setAttribute("aria-selected",String(on));b.tabIndex=on?0:-1;});["today","progress","plan","log"].forEach(x=>$("#v-"+x).hidden=x!==view);
  if(view==="progress")renderProgress();if(view==="plan")renderPlan();if(view==="log")renderLog();try{localStorage.setItem("cv-tab",view);}catch(e){}window.scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("nav.tabs").addEventListener("keydown",e=>{const order=["today","progress","plan","log"];let k=order.indexOf(S.view);if(e.key==="ArrowRight")k=(k+1)%4;else if(e.key==="ArrowLeft")k=(k+3)%4;else if(e.key==="Home")k=0;else if(e.key==="End")k=3;else return;e.preventDefault();show(order[k]);$("#tab-"+order[k]).focus();});
function setHdr(){const hd=$("header.top");const sticky=getComputedStyle(hd).position==="sticky";document.documentElement.style.setProperty("--hdr",(sticky?hd.offsetHeight:0)+"px");}
setHdr();window.addEventListener("resize",setHdr);try{new ResizeObserver(setHdr).observe($("header.top"));}catch(e){}
function applyLevel(){const lv=L();$("#levelchip").textContent=`Level ${lv.n} · ${lv.name}`;renderToday();if(S.view!=="today")show(S.view);}

renderToday();
try{const t=localStorage.getItem("cv-tab");if(t&&t!=="today")show(t);}catch(e){}


/* ---------- Firebase adapter (same shape the app already uses) ---------- */
function wrapDoc(s){return {id:s.id,exists:s.exists,data:()=>s.data(),metadata:{fromCache:s.metadata&&s.metadata.fromCache,hasPendingWrites:s.metadata&&s.metadata.hasPendingWrites}};}
function makeDB(fs,uid){
  const root=fs.collection("users").doc(uid);
  const ref=p=>{const parts=p.split("/");let r=root;parts.forEach((seg,i)=>{r=i%2===0?r.collection(seg):r.doc(seg);});return r;};
  return {
    doc:p=>{const r=ref(p);return {get:async()=>wrapDoc(await r.get()),set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrapDoc(s)),e)};},
    collection:p=>{const r=ref(p);const q=s=>({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty});return {get:async()=>q(await r.get()),onSnapshot:(n,e)=>r.onSnapshot(s=>n(q(s)),e)};}
  };
}

/* ---------- Claude API (optional, key stays on this device) ---------- */
function getKey(){try{return localStorage.getItem("cv-api-key")||"";}catch(e){return "";}}
function getModel(){try{return localStorage.getItem("cv-model")||"";}catch(e){return "";}}
async function pickModel(key){
  const r=await fetch("https://api.anthropic.com/v1/models?limit=50",{headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}});
  if(!r.ok)throw new Error("Key rejected ("+r.status+")");
  const j=await r.json();const ids=(j.data||[]).map(m=>m.id);
  return ids.find(i=>/sonnet/i.test(i))||ids[0];
}
function makeSample(key,model){
  const call=async(input,opts={})=>{
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:1500,messages})});
    if(r.status===429)throw {code:"rate_limited"};
    if(!r.ok)throw {code:"upstream_error",message:await r.text()};
    const j=await r.json();return {text:(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("")};
  };
  call.json=async(input,opts)=>{const {text}=await call(input,opts);const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<a)throw {code:"invalid_json"};return JSON.parse(text.slice(a,b+1));};
  return call;
}
function initSample(){const k=getKey(),m=getModel();S.sample=k&&m?makeSample(k,m):null;}

/* ---------- account + settings card ---------- */
function settingsCard(){
  const id=uid();const u=window.fbAuth&&fbAuth.currentUser;
  const el=h(`<div class="card"><h2>Account and settings</h2>
    <div id="${id}-acct"></div>
    <div><label for="${id}-k">Claude API key (turns on scoring, role-play and word checks)</label><input id="${id}-k" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(getKey())}"></div>
    <p class="muted" style="font-size:13px">Stored only in this browser. Add it once on each device. Model: <span class="mono">${esc(getModel()||"not set")}</span></p>
    <div class="row"><button class="primary" type="button" id="${id}-ks">Save key</button><button type="button" id="${id}-kc">Remove key</button></div></div>`);
  const acct=$("#"+id+"-acct",el);
  if(u){acct.append(h(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span>Signed in as <span class="mono">${esc(u.email)}</span></span><button type="button">Sign out</button></div>`));acct.querySelector("button").onclick=()=>fbAuth.signOut();}
  else acct.append(authForm());
  $("#"+id+"-ks",el).onclick=async(e)=>{const k=$("#"+id+"-k",el).value.trim();if(!k){toast("Paste your key first");return;}const b=e.currentTarget;b.disabled=true;b.textContent="Checking…";
    try{const m=await pickModel(k);localStorage.setItem("cv-api-key",k);localStorage.setItem("cv-model",m);initSample();toast("Key saved. Using "+m);renderLog();}catch(err){toast(String(err.message||err));}b.disabled=false;b.textContent="Save key";};
  $("#"+id+"-kc",el).onclick=()=>{try{localStorage.removeItem("cv-api-key");localStorage.removeItem("cv-model");}catch(e){}initSample();toast("Key removed");renderLog();};
  return el;
}
function authForm(){
  const id=uid();const el=h(`<div style="display:flex;flex-direction:column;gap:10px">
    <p class="muted" style="font-size:14px">Sign in with the same email on your PC and phone to sync.</p>
    <div><label for="${id}-e">Email</label><input id="${id}-e" type="email" autocomplete="username"></div>
    <div><label for="${id}-p">Password</label><input id="${id}-p" type="password" autocomplete="current-password"></div>
    <div class="row"><button class="primary" type="button" id="${id}-in">Sign in</button><button type="button" id="${id}-up">Create account</button><button type="button" id="${id}-rs">Reset password</button></div>
    <p id="${id}-err" class="muted" style="font-size:13px"></p></div>`);
  const go=async(fn)=>{const e=$("#"+id+"-e",el).value.trim(),p=$("#"+id+"-p",el).value;const er=$("#"+id+"-err",el);er.textContent="";
    try{await fn(e,p);}catch(x){er.textContent=(x&&x.message||String(x)).replace("Firebase: ","");}};
  $("#"+id+"-in",el).onclick=()=>go((e,p)=>fbAuth.signInWithEmailAndPassword(e,p));
  $("#"+id+"-up",el).onclick=()=>go((e,p)=>fbAuth.createUserWithEmailAndPassword(e,p));
  $("#"+id+"-rs",el).onclick=()=>go(async(e)=>{await fbAuth.sendPasswordResetEmail(e);toast("Reset email sent");});
  return el;
}
function showGate(){
  let g=$("#gate");if(g)g.remove();if(window.fbAuth&&fbAuth.currentUser)return;
  g=h(`<div id="gate" class="gatewrap"><div class="card gatecard"><div class="brand" style="justify-content:center">${document.querySelector(".brand").innerHTML}</div><h2 style="text-align:center">Sign in to sync</h2></div></div>`);
  $(".gatecard",g).append(authForm());
  const skip=h(`<button type="button" style="margin-top:4px">Continue without syncing</button>`);skip.onclick=()=>g.remove();$(".gatecard",g).append(skip);
  document.body.append(g);
}

/* ---------- baseline seed (first sign-in only) ---------- */
async function seedIfEmpty(db){
  const st=await db.doc("program/state").get();
  if(!st.exists)await db.doc("program/state").set({level:1,startDate:TODAY,history:[{level:1,date:TODAY}]});
  const b=await db.doc("sessions/baseline").get();
  if(!b.exists)await db.doc("sessions/baseline").set({date:"2026-09-18",level:0,baseline:true,blocks:{},reps:[],vocabManual:[],note:"Session 1 baseline from 4 real Teams calls, plus Session 2 Rep 2 retry audio.",bench:{f100:2.7,h100:2.7,tics:7,cf:false,scores:{clarity:3,precision:2,confidence:2,credibility:4,brevity:3,leadership:2}},analyzer:{falling:55,freezes:5,wpm:107,peak:-8.2,intel:96}});
}

/* ---------- start ---------- */
initSample();
let UNSUBS=[];
(function start(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/PASTE/.test(cfg.apiKey)){S.loaded=true;setSync("off");renderToday();return;}
  firebase.initializeApp(cfg);window.fbAuth=firebase.auth();const fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  fbAuth.onAuthStateChanged(async user=>{
    UNSUBS.forEach(u=>{try{u();}catch(e){}});UNSUBS=[];
    if(!user){S.db=null;S.loaded=true;setSync("off");S.sessions={};S.prog={level:1};renderToday();if(S.view==="log")renderLog();showGate();return;}
    const g=$("#gate");if(g)g.remove();
    const db=makeDB(fs,user.uid);S.db=db;S.loaded=true;setSync("busy");
    try{await seedIfEmpty(db);}catch(e){console.warn(e);}
    let first=true;
    UNSUBS.push(db.doc("program/state").onSnapshot(snap=>{const d=snap.exists?snap.data():null;const old=S.prog.level;S.prog=d?JSON.parse(JSON.stringify(d)):{level:1};
      if(old!==S.prog.level){$("#levelchip").textContent=`Level ${L().n} · ${L().name}`;if(!S.touched)renderToday();}},e=>console.warn(e)));
    UNSUBS.push(db.collection("sessions").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=JSON.parse(JSON.stringify(d.data())));
      const local=S.sessions[TODAY];S.sessions=m;if(local&&S.touched)S.sessions[TODAY]=local;
      setSync("on",new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
      if(first||!S.touched){first=false;renderToday();}else refreshTodayStatus();
      if(S.view==="progress")renderProgress();if(S.view==="log"&&!document.activeElement.matches("textarea,input"))renderLog();},e=>{console.warn(e);setSync("off");}));
  });
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}

</script>
